# Конфигурация системы. Секретов здесь нет: пароли только в .env.

sources:
  archive:
    # Архив статусов (Rudolph Santarromana, Swiss-public-charging-dataset; первоисточник BFE / opendata.swiss)
    base_url: "https://raw.githubusercontent.com/rudolphsanta/Swiss-public-charging-dataset/main/Swiss-EVChg-Data_Parquet"
    file_pattern: "{month}_charging.7z"
    months_from: "2024-01"
    months_to: "2025-12"
    known_empty_months: ["2024-12"]          # файл в источнике пустой
    known_partial_months: ["2024-10"]        # неполный месяц
    details_url: "https://raw.githubusercontent.com/rudolphsanta/Swiss-public-charging-dataset/main/ChargingStationDetails_19-02-2026.csv"
    timeout_s: [10, 300]
    # Ресурсы DuckDB: месяц (~150 млн строк) обрабатывается частями по хэшу EvseID
    n_parts: 16
    duckdb_memory: "3GB"
    duckdb_threads: 3
    retries_on_oom: 1

  evse_status:
    url: "https://data.geo.admin.ch/ch.bfe.ladestellen-elektromobilitaet/status/ch.bfe.ladestellen-elektromobilitaet.json"
    cache_minutes: 5                          # не чаще одного снимка за 5-минутный слот
    timeout_s: [10, 90]

  evse_data:
    url: "https://data.geo.admin.ch/ch.bfe.ladestellen-elektromobilitaet/data/ch.bfe.ladestellen-elektromobilitaet.json"
    timeout_s: [10, 240]

  weather:
    archive_url: "https://archive-api.open-meteo.com/v1/archive"
    historical_forecast_url: "https://historical-forecast-api.open-meteo.com/v1/forecast"
    forecast_url: "https://api.open-meteo.com/v1/forecast"
    hourly_variables: [temperature_2m, precipitation, snowfall, wind_speed_10m]
    publication_delay_days: 3
    backfill_from: "2024-01-01"
    chunk_days: 366                           # длина окна одного запроса
    forecast_cache_minutes: 60
    timeout_s: [10, 90]

  vehicles:
    # Open EV Data (KilowattApp), MIT с обязательным указанием источника; chargeprice/open-ev-data удалён
    open_ev_data_url: "https://raw.githubusercontent.com/KilowattApp/open-ev-data/master/data/ev-data.json"
    manual_csv: "config/vehicles_manual.csv"
    timeout_s: [10, 60]

  postal:
    # Amtliches Ortschaftenverzeichnis (swisstopo), PLZ → кантон, WGS84
    url: "https://data.geo.admin.ch/ch.swisstopo-vd.ortschaftenverzeichnis_plz/ortschaftenverzeichnis_plz/ortschaftenverzeichnis_plz_4326.csv.zip"
    timeout_s: [10, 120]

  geocoder:
    url: "https://api3.geo.admin.ch/rest/services/api/SearchServer"
    timeout_s: [5, 15]

