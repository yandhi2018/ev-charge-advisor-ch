# Разрешение сущностей: точки одной станции
station_resolution:
  max_distance_m: 30

# Рекомендатель (раздел 5 DESIGN.md)
recommender:
  radius_km: 15
  radius_max_km: 50
  min_candidates: 5
  top_n: 5
  detour_factor: 1.3
  speed_kmh_near: 35          # до 5 км
  speed_kmh_far: 60
  near_threshold_km: 5
  wait_penalty_min: 20
  energy_options_kwh: [10, 20, 40]
  default_energy_kwh: 20
  cold_warning_c: 0
  status_max_age_min: 30      # старше — показываем предупреждение

routing:
  engine: "haversine"         # haversine | osrm
  osrm_url: "http://127.0.0.1:5000"

models:
  random_seed: 42
  canton:
    horizons_h: [1, 2, 3, 6, 12, 24]
    folds:
      - { train_to: "2025-05-31", test_from: "2025-06-08", test_to: "2025-07-31" }
      - { train_to: "2025-07-31", test_from: "2025-08-08", test_to: "2025-09-30" }
      - { train_to: "2025-09-30", test_from: "2025-10-08", test_to: "2025-12-31" }
  availability:
    train_from: "2025-01-01"
    train_to: "2025-08-31"
    valid_from: "2025-09-02"
    valid_to: "2025-10-31"
    test_from: "2025-11-02"
    test_to: "2025-12-31"
    sample_share: 0.01
    deltas_min: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60]

web:
  host: "127.0.0.1"
  port: 8000
